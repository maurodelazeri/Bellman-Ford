[workspace]
resolver = "2"
members = [
    "crates/spray-core",
    "crates/spray-service",
    "crates/spray-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
restate-sdk = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util", "parking_lot"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "server", "http1", "http2", "tokio"] }
http-body-util = "0.1"
bytes = "1"
anyhow = "1"
hdrhistogram = { version = "7", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Release profile tuned for latency measurement: we care about the code under
# test, not about compile time.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
# Keep unwinding: the Restate SDK catches handler panics and turns them into
# retryable errors. `panic = "abort"` would turn a single bad transaction into
# a whole-process crash.
debug = 1
